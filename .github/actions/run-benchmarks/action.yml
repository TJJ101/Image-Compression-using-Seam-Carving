name: Run benchmarks
description: >
  Runs the Google Benchmark suite (bench/, seamcarve_bench) that compares the seam-carving implementations,
  writes a results table to the run's summary page and uploads the JSON report as an artifact. Benchmarks of
  algorithms that are not implemented yet are listed as skipped; any other error fails the step.

# Used by the test jobs in .github/workflows/, after the "vcpkg" preset was built (it builds seamcarve_bench too):
#   - run: cmake --build --preset vcpkg
#   - uses: ./.github/actions/run-benchmarks
#
# Works on GitHub-hosted and self-hosted Windows runners.

inputs:
  repetitions:
    description: How many times each benchmark is repeated; the table shows the mean
    default: '3'
  report-path:
    description: Folder the benchmark JSON report (benchmark.json) is written to
    default: '${{ github.workspace }}\BenchReports'
  artifact-name:
    description: Name of the uploaded artifact holding the report
    default: benchmark-results

runs:
  using: composite
  steps:
    - name: Run Benchmarks
      shell: powershell
      env:
        BENCH_PATH: ${{ inputs.report-path }}
        BENCH_REPETITIONS: ${{ inputs.repetitions }}
      run: |
        if (Test-Path "$env:BENCH_PATH") { Remove-Item -Recurse -Force "$env:BENCH_PATH" }
        New-Item -ItemType Directory -Force "$env:BENCH_PATH" | Out-Null
        $Json = Join-Path $env:BENCH_PATH 'benchmark.json'
        # The Visual Studio generator puts the exe in build\Release, a single-config generator in build
        $Exe = @("build\Release\seamcarve_bench.exe", "build\seamcarve_bench.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $Exe) { throw "seamcarve_bench.exe not found: build the vcpkg preset (cmake --build --preset vcpkg) first" }
        # The JSON file keeps every repetition (skipped benchmarks have no aggregates); the log shows only mean/median/stddev
        & $Exe "--benchmark_out=$Json" --benchmark_out_format=json `
          "--benchmark_repetitions=$env:BENCH_REPETITIONS" --benchmark_display_aggregates_only=true
        $BenchExit = $LASTEXITCODE
        if (-not (Test-Path $Json)) { throw "No benchmark report was written to $Json" }

        # One row per benchmark: the mean over the repetitions, or the skip / error message
        $Report = Get-Content $Json -Raw | ConvertFrom-Json
        $Entries = [ordered]@{}
        $BigO = @()
        $Errors = 0
        foreach ($B in $Report.benchmarks) {
          if ($B.aggregate_name -eq 'BigO') { $BigO += $B; continue }
          if ($B.run_type -eq 'aggregate' -and $B.aggregate_name -ne 'mean') { continue }
          $Key = $B.run_name
          if ($B.error_occurred) {
            if (-not $Entries.Contains($Key)) { $Entries[$Key] = "| $Key | - | - | error: $($B.error_message) |"; $Errors++ }
          } elseif ($B.skipped) {
            if (-not $Entries.Contains($Key)) { $Entries[$Key] = "| $Key | - | - | skipped: $($B.skip_message) |" }
          } elseif ($B.run_type -eq 'aggregate' -or -not $Entries.Contains($Key)) {
            $Status = if ($B.label) { "ok ($($B.label))" } else { 'ok' }
            $Entries[$Key] = "| $Key | {0:N2} {2} | {1:N2} {2} | {3} |" -f [double]$B.real_time, [double]$B.cpu_time, $B.time_unit, $Status
          }
        }
        $Summary = @("### SeamCarve benchmarks", "",
          "Mean over $env:BENCH_REPETITIONS repetitions on a $($Report.context.num_cpus)-CPU runner.", "",
          "| Benchmark | Wall time | CPU time | Status |", "|---|---|---|---|") + @($Entries.Values)
        if ($BigO.Count -gt 0) {
          $Summary += @("", "Fitted complexity (N = image width; the aspect ratio stays fixed):", "", "| Benchmark | Big-O | CPU coefficient |", "|---|---|---|")
          $Summary += @($BigO | ForEach-Object { "| $($_.name -replace '_BigO$', '') | O($($_.big_o.Trim('()'))) | {0:G4} {1} |" -f [double]$_.cpu_coefficient, $_.time_unit })
        }
        $Summary | ForEach-Object { Write-Host $_ }
        # AppendAllText writes UTF-8 without a BOM, which Out-File / >> in Windows PowerShell 5.1 would not
        if ($env:GITHUB_STEP_SUMMARY) { [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, (($Summary -join "`n") + "`n")) }
        if ($BenchExit -ne 0) { throw "seamcarve_bench exited with code $BenchExit" }
        if ($Errors -gt 0) { throw "$Errors benchmark(s) failed with an error, see the table above" }
    - name: Upload Benchmark Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-path }}
        if-no-files-found: warn
